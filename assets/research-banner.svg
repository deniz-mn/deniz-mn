  <g fill="#152739" stroke="#64d8c5" stroke-width="1.7">
    <circle cx="625" cy="100" r="7"/><circle cx="625" cy="190" r="7"/>
  </g>
  <g fill="#1b2943" stroke="#90adf5" stroke-width="1.7">
    <circle cx="732" cy="75" r="8"/><circle cx="732" cy="145" r="8"/><circle cx="732" cy="215" r="8"/>
