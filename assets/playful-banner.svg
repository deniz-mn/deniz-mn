<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc">
<title id="title">deniz-mn — Computer Engineering</title>
<desc id="desc">A cheerful little computer blinks while colorful code, a light bulb and geometric shapes float around it on a white background.</desc>
<style>
text{font-family:'Segoe UI',Arial,sans-serif}.float{animation:float 4s ease-in-out infinite}.other{animation-delay:-2s;animation-duration:5s}.blink{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}.look{animation:look 7s ease-in-out infinite}.spark{transform-box:fill-box;transform-origin:center;animation:spark 3s ease-in-out infinite}.cursor{animation:cursor 1.4s steps(2,end) infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}@keyframes blink{0%,42%,46%,100%{transform:scaleY(1)}44%{transform:scaleY(.12)}}@keyframes look{0%,20%,100%{transform:translateX(0)}35%,55%{transform:translateX(5px)}70%,85%{transform:translateX(-4px)}}@keyframes spark{0%,100%{transform:rotate(-10deg) scale(.8);opacity:.55}50%{transform:rotate(12deg) scale(1.1);opacity:1}}@keyframes cursor{50%{opacity:0}}@media(prefers-reduced-motion:reduce){.float,.blink,.look,.spark,.cursor{animation:none}}
</style>
